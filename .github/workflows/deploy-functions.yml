name: Deploy Firebase Functions

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firebase.json'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install function dependencies
        run: npm install --prefix functions

      - name: Write service account key
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA_JSON" ]; then
            echo "::error::Le secret FIREBASE_SERVICE_ACCOUNT est vide ou absent (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          node -e "const k=require(process.env.RUNNER_TEMP+'/sa.json'); if(!k.private_key||!k.client_email){process.exit(1)}; console.log('Clé valide pour', k.client_email)" \
            || { echo "::error::Le secret FIREBASE_SERVICE_ACCOUNT n'est pas un JSON de clé de compte de service complet."; exit 1; }

      - name: Deploy functions
        run: npx --yes firebase-tools@latest deploy --only functions --project "${{ secrets.VITE_FIREBASE_PROJECT_ID }}" --non-interactive --force
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
